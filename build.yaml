changelog:
  developer:
  - SnapToBoundary cards now use a truncation model: one card file per program at the max pad length (SnapMinutes), trimmed at stream time to the actual pad needed. Card set stays bounded (one per program) regardless of loop reshuffles or rotation shifts — no combinatorial explosion of (previous-program, next-program) pairs. Card content is unchanged; only the file duration and playback truncation. Channels with FillerMode=SnapToBoundary automatically use the per-item stream pipeline (concat mode can't truncate).
