overview: "Fork of JPKribs Live Channels with an expanded scheduling model and filler support."
description: >
  MyChannels is a fork of JPKribs' Live Channels plugin, extended with per-entry weight and block
  size, weighted round-robin scheduling, filler pools for bumpers and trailers, an auto-generated
  Up Next card, and event-driven cache invalidation. Channels, their guide, and their streams are
  served in-process through Jellyfin's own Live TV — no tuner to add, no URLs to paste.
category: "Live TV"
