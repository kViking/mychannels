changelog:
  developer:
  - Fix Content Weights display race across channel switches. Two overlapping bugs. First, the additive-merge race - switching channels while the previous channel's resolve-top-level POST was in flight caused the two responses' rows to be merged into a single _topLevelById dict (the .then did .forEach(r => _topLevelById[r.id] = r) instead of a full replace, so a late-returning older response would leak its rows into the newer one), so the DOM ended up showing a union of both channels' items with only whichever channel's EntryOverrides "won" the callback race applied. Fixed by tagging each hydrate call with a monotonic sequence id and returning early from stale callbacks, and doing a full replace of _topLevelById in the winning callback. Second, the sync-render-before-hydrate bug - loadEditor called renderEntryOverrides synchronously before hydrateEntryOverrides, so the DOM briefly showed the PREVIOUS channel's items with the CURRENT channel's EntryOverrides applied. Fixed by clearing hydrate state explicitly before the sync render so a clean Loading placeholder shows in the interim.
