changelog:
  developer:
  - Add a diagnostic log line at every channel resolve, dumping the override table (id, weight, blockSize) and the resolved per-group scheduler input (id, series/title, weight, blockSize, item count). Lets a "weight not respected" report be checked against actual scheduler input without needing to inspect the plugin config XML — a mismatch between the override id and the group's TopLevelItemId is the exact bug we're hunting.
