changelog:
  developer:
  - Scheduling rewrite. Weight and Block-size are now set per top-level item in the channel (series, movie, collection) rather than as channel-wide FavorKind/EpisodesPerBlock knobs. Editor gains a Content Weights section that lists the resolved items with per-row inputs. Loop builder groups by top-level item, allocates round-robin slots by each group's weight, and chunks episodes by each group's block size. FavorKind/FavorStrength/EpisodesPerBlock are deprecated (ignored by the scheduler and hidden from the UI; kept in the model for one release for XML round-trip). A warning is logged on plugin load for any channel that still carries a legacy FavorKind so you can set per-entry weights instead.
