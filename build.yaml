changelog:
  developer:
  - Full-loop scheduling. Each shuffled loop now airs every top-level item's blocks (shorter groups wrap and repeat blocks when they run out) instead of contributing just one block per loop. Loop length = weight x cycles, where cycles = the longest group's ceil(blocks / weight).
  - New Series interleave setting on the channel. Same keeps the group deal order stable across cycles (TNG, DS9, VOY every cycle). Shuffled reshuffles the order per cycle (TNG, DS9, VOY then DS9, VOY, TNG). Both deterministic (guide and stream agree).
