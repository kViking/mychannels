changelog:
  developer:
  - Filler subsystem. New per-channel Auto Up Next card setting: Off (default, unchanged), FixedBumper (short card before every program, length configurable), or SnapToBoundary (variable-length card that pads program-end to the next 15/30/60-minute grid so programs start on tidy times like broadcast TV). Cards show the next program's landscape backdrop with a dark panel on the right and an "Up Next" title overlay, with a subtle Ken Burns zoom to fight burn-in during long slates. Cards are cached to /cache/livechannels/cards/... and generated once per (program, duration).
