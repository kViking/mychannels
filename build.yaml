changelog:
  developer:
  - Port the tuned Up Next card filter chain from testcards/gen-card.sh into AutoCardService. New cards: bumped from 24 to 60 fps, Ken Burns removed (was steppy on still images), 760x340 panel flush to bottom-right with a per-pixel radial gradient that fades to fully transparent at the top edge (attaches visually to the frame bottom instead of floating), text lags panel by 100ms on entry. Cards auto-fit N cycles based on their duration - a 30s card holds twice, a 2-minute card holds enough times to spread evenly, keeping burn-in and viewer attention in check without any card being on-screen for more than a few seconds at a stretch. Structural head/tail fades from/to black (500ms each) always happen.
